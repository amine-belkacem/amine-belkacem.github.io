<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">

  <meta name="theme-color" content="#07090a">
  <link rel="preconnect" href="https://fonts.googleapis.com">

<body>
  <div class="glow" id="glow" aria-hidden="true"></div>

  <header class="topbar">
    <a class="logo" href="#top" aria-label="Home"><span class="die"></span><b>MAB</b></a>
    <nav class="nav" id="nav"></nav>
    <div class="tools">
      <span class="live" id="live"></span>
      <a class="btn small" id="pdfLink" href="portfolio-en.pdf"></a>
      <button class="btn small" id="langBtn" type="button"></button>

  <main id="top">

      <div class="scope">
        <canvas id="scopeCanvas" aria-hidden="true"></canvas>
        <div class="readouts" id="readouts"></div>
      </div>

    <div class="marquee" aria-hidden="true"><div class="marquee-track" id="marquee"></div></div>

    <section class="section" id="method"></section>

    <section class="section" id="projects">
      <div class="sec-head" id="featHead"></div>
      <div class="featured" id="featured"></div>

      <div class="sec-head" id="allHead"></div>
      <div class="filters" id="filters" role="toolbar"></div>
      <div class="grid" id="grid"></div>
    </section>

    <section class="section" id="skills"></section>
    <section class="section" id="path"></section>
    <section class="section contact" id="contact"></section>

    <section class="print-list" id="printList" aria-hidden="true"></section>

  <footer class="footer" id="footer"></footer>

  <dialog class="modal" id="modal">
    <div class="modal-body" id="modalBody"></div>
  </dialog>

  <script src="js/data.js"></script>

</html>
